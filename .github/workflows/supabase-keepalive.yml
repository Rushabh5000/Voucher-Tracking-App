name: Supabase keep-alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC — well within Supabase's 7-day pause threshold
    - cron: "0 8 */3 * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg
        run: npm install pg

      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
          const { Client } = require('./node_modules/pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          client.connect()
            .then(() => client.query('SELECT 1'))
            .then(() => { console.log('keep-alive ping OK'); return client.end(); })
            .catch(err => { console.error('ping failed:', err.message); process.exit(1); });
          "

      # A raw Postgres connection keeps the database itself warm, but Supabase's
      # own "project inactive" pause detector watches its monitored API surface
      # (PostgREST etc.), not direct pg connections — hence pause-warning emails
      # even though the DB above was pinged on schedule. Also hit the REST API
      # with the anon key so Supabase counts this as real project activity.
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The bare /rest/v1/ root (OpenAPI spec) requires a secret key under
          # Supabase's newer key format; a real table query works fine with the
          # publishable key, so query one instead.
          curl -sf "$SUPABASE_URL/rest/v1/Card?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null \
            && echo "REST API ping OK"
